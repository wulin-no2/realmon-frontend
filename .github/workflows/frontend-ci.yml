name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform web --output-dir web-build
        env:
          EXPO_PUBLIC_API_BASE_URL: http://localhost:8080
